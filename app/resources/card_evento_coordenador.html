<!--[main]-->
<style>
    .card-fafram-pro {
        background-color: var(--bs-card-bg, #1e293b);
        border: 1px solid var(--bs-border-color, #334155);
        border-radius: 12px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        overflow: hidden;
    }

    .card-fafram-pro:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15) !important;
        border-color: #ea580c !important;
    }

    .card-img-wrapper {
        width: 100%;
        height: 170px;
        border-radius: 8px;
        background-color: var(--bs-tertiary-bg, #0f172a);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--bs-border-color, #334155);
        padding: 8px;
    }

    .card-img-wrapper img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain !important;
    }

    .card-title-clamp {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.7em;
        line-height: 1.35;
    }

    .btn-action-custom {
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        text-decoration: none !important;
    }

    .btn-action-edit {
        background-color: rgba(59, 130, 246, 0.08);
        color: #60a5fa !important;
        border: 1px solid rgba(96, 165, 250, 0.4);
    }
    .btn-action-edit:hover {
        background-color: #2563eb;
        color: #ffffff !important;
        border-color: #2563eb;
    }

    .btn-action-cert {
        background-color: rgba(245, 158, 11, 0.08);
        color: #fbbf24 !important;
        border: 1px solid rgba(251, 191, 36, 0.4);
    }
    .btn-action-cert:hover {
        background-color: #d97706;
        color: #ffffff !important;
        border-color: #d97706;
    }

    .btn-action-report {
        background-color: rgba(16, 185, 129, 0.08);
        color: #34d399 !important;
        border: 1px solid rgba(52, 211, 153, 0.4);
    }
    .btn-action-report:hover {
        background-color: #059669;
        color: #ffffff !important;
        border-color: #059669;
    }

    .btn-action-delete {
        background-color: rgba(239, 68, 68, 0.08);
        color: #f87171 !important;
        border: 1px solid rgba(248, 113, 113, 0.4);
    }
    .btn-action-delete:hover {
        background-color: #dc2626;
        color: #ffffff !important;
        border-color: #dc2626;
    }
</style>

<div class="row g-3 g-md-4 pt-2">
    <!--[eventos]-->
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card card-fafram-pro shadow-sm h-100">
            <div class="card-body d-flex flex-column p-3 p-md-4">

                <!-- Status + ID Evento -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge {$status_class} px-2.5 py-1.5 fw-semibold border">
                        <i class="fas fa-circle ms-1 me-1" style="font-size: 6px; vertical-align: middle;"></i> {$status_texto}
                    </span>
                    <small class="text-muted fw-semibold">#{$id_evento}</small>
                </div>

                <!-- Banner / Arte do Evento -->
                <div class="card-img-wrapper mb-3">
                    <img src="{$arte}" class="{$img_class}" alt="Arte do Evento">
                </div>

                <!-- Título do Evento -->
                <h5 class="fw-bold mb-2 text-body card-title-clamp text-break" title="{$titulo_evento}">{$titulo_evento}</h5>

                <!-- Data de Início -->
                <div class="text-muted small mb-3">
                    <i class="far fa-calendar-alt me-1 text-primary"></i> <b>Data Início:</b> {$data_inicio}
                </div>

                <!-- Seção Opcional de Parecer -->
                <!--[parecer]-->
                <div class="p-2 mb-3 rounded-2 bg-body-tertiary border-start border-3 border-warning small text-body-secondary">
                    <b>Parecer:</b> {$observacao_aprovacao}
                </div>
                <!--[/parecer]-->

                <!-- Rodapé com Botões -->
                <div class="mt-auto pt-3 border-top border-opacity-10 d-flex gap-1.5 justify-content-between">
                    <a generator="adianti" href="{$action_edit}" class="btn-action-custom btn-action-edit flex-fill" title="Editar Evento">
                        <i class="fas fa-edit"></i> <span>Editar</span>
                    </a>
                    <a generator="adianti" href="{$action_certificados}" class="btn-action-custom btn-action-cert flex-fill" title="Gerenciar Certificados">
                        <i class="fas fa-certificate"></i> <span>Certificados</span>
                    </a>
                    <a generator="adianti" href="{$action_relatorio}" class="btn-action-custom btn-action-report flex-fill" title="Relatório do Evento">
                        <i class="fas fa-file-alt"></i> <span>Inscrições</span>
                    </a>
                    <a generator="adianti" href="{$action_delete}" class="btn-action-custom btn-action-delete px-2.5" title="Excluir Evento">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </div>

            </div>
        </div>
    </div>
    <!--[/eventos]-->

    <!--[empty]-->
    <div class="col-12 text-center p-4">
        <p class="text-muted">Nenhuma solicitação encontrada.</p>
    </div>
    <!--[/empty]-->
</div>
<!--[/main]-->
