<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .certificado {
            border: 3px solid #000;
            padding: 40px;
        }
        h1 {
            font-size: 28px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="certificado">
        <h1>Certificado de Participação</h1>
        <p>
            A Faculdade de Filosofia, Ciências e Letras de Ituverava certifica que
            <strong>{nome}</strong>, portador(a) do RG <strong>{rg}</strong>,
            participou do evento <strong>{titulo_evento}</strong>,
            realizado entre <strong>{inicio}</strong> e <strong>{termino}</strong>,
            com carga horária de <strong>{carga_horaria}</strong> horas.
        </p>
    </div>
</body>
</html>
